/* ============================================================
   RENDER - stock and miners (v3)
   ============================================================ */
function stockHint(it){
  if(it._removed) return '<span class="stag gone" title="This code is not in the sheet anymore">Removed</span>';
  var s = stockOf(it);
  if(!s || s.status === 'none') return '';
  if(s.sheet){
    if(s.bal === 'overstock') return '<span class="stag overstock" title="'+s.balance+' more '+s.supplyFrom+' than the mine total">+'+s.balance+' over</span>';
    if(s.bal === 'shortstock') return '<span class="stag shortstock" title="'+(-s.balance)+' more mined than '+s.supplyFrom+'">Short '+(-s.balance)+'</span>';
    return '<span class="stag complete" title="'+s.supply+' '+s.supplyFrom+', '+s.source+' mined">Complete</span>';
  }
  if(s.status === 'over') return '<span class="stag over" title="'+(-s.projected)+' more tagged than arrived plus upcoming">Over '+(-s.projected)+'</span>';
  if(s.status === 'short') return '<span class="stag short" title="'+(-s.remaining)+' tagged ahead of stock, upcoming covers them">Short '+(-s.remaining)+'</span>';
  if(s.status === 'out') return '<span class="stag out" title="Every arrived unit is tagged">All tagged</span>';
  return '<span class="stag left" title="'+s.remaining+' of '+s.arrived+' not tagged yet">'+s.remaining+' left</span>';
}

function tallyHTML(s, tags){
  tags = tags || STOCK_TAGS;
  if(s.arrived == null){
    /* not counted yet: just the tagged units */
    if(!s.tagged) return '';
  }
  var A = s.arrived || 0, U = s.upcoming, T = s.tagged, cap = A + U;
  var total = Math.max(T, cap);
  if(!total) return '';
  var counted = s.arrived != null;
  var label = T + ' tagged' + (counted ? ' of ' + A + ' arrived' + (U ? ' plus ' + U + ' upcoming' : '') : '');
  var h = '';
  if(total <= 60){
    /* order: tagged units, open units in hand, then upcoming units not tagged yet.
       A line marks where the arrived stock stops. */
    var i = 0;
    function pip(cls, title, sw){
      var o = '';
      if(counted && i === A && A > 0 && total > A) o += '<i class="pipcut" title="Quantity arrived stops here"></i>';
      o += '<i class="pip'+(cls ? ' ' + cls : '')+'" title="'+title+'" style="'+(sw ? '--sw:'+sw+';' : '')+
           'animation-delay:'+(Math.min(i, 45) * 12)+'ms"></i>';
      i++;
      return o;
    }
    h += '<div class="pips" role="img" aria-label="'+esc(label)+'">';
    tags.forEach(function(t){
      for(var j = 0; j < s[t.k]; j++){
        var cls = !counted ? '' : i >= cap ? 'extra' : i >= A ? 'ahead' : '';
        var title = cls === 'extra' ? t.label + ', no stock for this one'
                  : cls === 'ahead' ? t.label + ', waiting for upcoming stock' : t.label;
        h += pip(cls, title, t.c);
      }
    });
    while(counted && i < A) h += pip('open', 'In hand, not tagged yet');
    while(counted && i < cap) h += pip('soon', 'Upcoming, not tagged yet');
    h += '</div>';
  } else {
    h += '<div class="sbar" role="img" aria-label="'+esc(label)+'"><div class="fill" style="width:'+(T / total * 100)+'%">';
    tags.forEach(function(t){
      if(s[t.k]) h += '<i title="'+t.label+' '+s[t.k]+'" style="flex:'+s[t.k]+';background:'+t.c+'"></i>';
    });
    h += '</div>';
    if(counted && U) h += '<div class="upzone" style="left:'+(A / total * 100)+'%;width:'+(U / total * 100)+'%" title="Upcoming stock"></div>';
    if(counted && T > cap) h += '<div class="overzone" style="left:'+(cap / total * 100)+'%" title="Tagged past arrived plus upcoming"></div>';
    h += '</div>';
  }
  return '<div class="tally">' + h + '</div>';
}

function stockSection(it){
  var s = stockOf(it), h;
  if(sheetOn()){
    h = sheetStockHead(it);
    if(it._removed) return h + removedCard(it) + '</div>';
    if(!s){
      return h + '<div class="nopost">No stock count yet.<br>' +
        (it._inSheet ? 'It is on row ' + it._sheetRow + ' of the sheet. The numbers show here once they are filled in.'
                     : 'This code is not in the sheet. Add a row and paste the code.') +
        (it._inSheet ? '' : '<div class="pacts"><button class="pact" data-copy="'+esc(it.code)+'">Copy code</button></div>') +
        '</div></div>';
    }
    if(s.sheet) return h + sheetCard(s) + '</div>';
  } else {
    h = '<div class="sect"><h3>Stock and miners <button class="slink" data-editstock="'+esc(it.code)+'">'+
        (s ? 'Edit numbers' : '+ Add numbers')+'</button></h3>';
    if(!s){
      return h + '<div class="nopost">No stock count yet.<br>Add the numbers once the item arrives.</div></div>';
    }
  }
  var over = s.status === 'over', short = s.status === 'short';
  var big = s.remaining == null ? '–' : over ? '+' + (-s.projected) : short ? '+' + (-s.remaining) : s.remaining;

  h += '<div class="stockcard s-'+s.status+'">';

  h += '<div class="shero"><div>' +
         '<div class="big">'+big+'</div>' +
         '<div class="lbl">'+(over ? 'Over tagged' : short ? 'Tagged ahead' : 'Remaining stock')+'</div>' +
       '</div><div class="sright">' +
         '<span class="sstatus '+s.status+'">'+STATUS_LABEL[s.status]+'</span>' +
         '<div class="arrs">' +
           '<div class="arr"><b>'+(s.arrived == null ? '–' : s.arrived)+'</b><span>Quantity arrived</span></div>' +
           '<div class="arr soon'+(s.upcoming ? '' : ' zero')+'"><b>'+(s.upcoming ? '+' + s.upcoming : '0')+'</b><span>Upcoming</span></div>' +
         '</div>' +
       '</div></div>';

  h += tallyHTML(s);

  if(s.arrived == null){
    h += '<div class="sformula"><b>'+s.tagged+'</b> tagged so far. Add the quantity arrived to see what is left.</div>';
  } else {
    var inHand = s.remaining >= 0 ? s.remaining + ' left'
               : s.upcoming ? 'short by ' + (-s.remaining) : 'over by ' + (-s.remaining);
    h += '<div class="sformula"><b>'+s.arrived+'</b> arrived − <b>'+s.tagged+'</b> tagged = <b>'+inHand+'</b>';
    h += '</div>';
  }

  function plural(n, one, many){ return n + ' ' + (n === 1 ? one : many); }
  if(over){
    h += '<div class="snote"><b>Check the tags.</b> '+plural(-s.projected, 'more miner is', 'more miners are')+
         ' tagged than '+(s.upcoming ? 'arrived plus upcoming' : 'what arrived')+'.</div>';
  } else if(short){
    h += '<div class="snote"><b>Covered by upcoming.</b> '+plural(-s.remaining, 'miner is', 'miners are')+
         ' tagged ahead of stock. The '+s.upcoming+' upcoming covers them'+
         (s.projected ? ', with '+s.projected+' left after.' : '.')+'</div>';
  } else if(s.status === 'offer'){
    var give = Math.min(s.remaining, s.waiting);
    h += '<div class="snote"><b>Offer to waiting miners.</b> '+s.remaining+' left and '+s.waiting+' in line. '+
         'Offer '+give+' to the next '+(give === 1 ? 'miner' : 'miners')+'.'+
         (s.upcoming ? ' '+s.upcoming+' more upcoming.' : '')+'</div>';
  } else if(s.status === 'out' && (s.waiting || s.upcoming)){
    h += '<div class="snote"><b>All tagged.</b> '+
         (s.upcoming ? s.upcoming+' upcoming, not tagged yet. ' : '')+
         (s.waiting ? (s.upcoming ? 'Offer them to the '+s.waiting+' waiting when they arrive.'
                                  : s.waiting+' still waiting in case someone drops.') : '')+'</div>';
  }

  h += '<div class="stiles">';
  STOCK_TAGS.forEach(function(t){
    var v = s[t.k];
    var share = s.arrived ? Math.round(v / s.arrived * 100) + '% of arrived' : ' ';
    h += '<div class="stile'+(v ? '' : ' zero')+'">' +
           '<span class="skey" style="--sw:'+t.c+'"><i></i>'+t.label+'</span>' +
           '<b>'+v+'</b><small>'+share+'</small></div>';
  });
  h += '</div>';

  h += upcomingHTML(s);

  h += '<div class="sfoot">' +
         '<div class="sdrop'+(s.droppedTotal ? '' : ' zero')+'"><span class="skey">Did not get</span>' +
           '<div class="srow"><b>'+s.droppedTotal+'</b><div class="dchips">' +
           DROP_TAGS.map(function(t){
             var v = s.dropped[t.k];
             return '<span class="dchip'+(v ? '' : ' zero')+'">'+t.label+'<b>'+v+'</b></span>';
           }).join('') +
         '</div></div></div>' +
         '<div class="swait'+(s.waiting ? '' : ' zero')+'"><span class="skey">Waiting</span>' +
           '<b>'+s.waiting+'</b><small>miners in line</small></div>' +
       '</div>';

  h += '</div></div>';
  return h;
}

/* ------------------------------------------------------------
   Dashboard stock card (sheet v5). Same look as the v3 card, the sheet's numbers.
   ------------------------------------------------------------ */
var COLL_TAGS = STOCK_TAGS.filter(function(t){ return t.k === 'invoiced' || t.k === 'paid'; });
function sgn(v){ return v < 0 ? '\u2212' + (-v) : String(v); }
function pct(v){ return (Math.round(v * 100) / 100) + '%'; }
function sheetCard(s){
  function plural(n, one, many){ return n + ' ' + (n === 1 ? one : many); }
  var e = s.entered, over = s.status === 'over', short = s.status === 'short';
  var h = '<div class="stockcard s-'+s.status+' s-'+s.bal+'">';
  /* left = invoice balance (on hand - collected), right = stock balance (ordered - mine total) */
  var invLabel = s.remaining < 0 ? 'Over invoiced' : s.remaining > 0 ? 'Under invoiced' : 'Fully invoiced';
  var balTxt = s.balance > 0 ? '+' + s.balance : sgn(s.balance);
  var remTxt = e ? (s.remaining > 0 ? '+' + s.remaining : sgn(s.remaining)) : '';

  function tile(head, sub, v, txt, label){
    var k = !e ? 'none' : v < 0 ? 'neg' : v > 0 ? 'pos' : 'zero';
    var mark = {neg:'\u25BC', pos:'\u25B2', zero:'=', none:'\u2013'}[k];
    return '<div class="btile '+k+'"><div class="bhead">'+head+'<small>'+sub+'</small></div>' +
           '<div class="bn">'+(e ? txt : '\u2013')+'</div>' +
           '<span class="bstat"><i aria-hidden="true">'+mark+'</i>'+label+'</span></div>';
  }
  h += '<div class="sbal">' +
       tile('Invoice', 'on hand \u2212 collected', s.remaining, remTxt, e ? invLabel : 'Stock not entered') +
       tile('Stock', s.supplyFrom + ' \u2212 mine total', s.balance, balTxt, BAL_LABEL[s.bal]) +
       '</div>';

  /* where the stock comes from */
  if(s.orders || s.jpn || s.macnn || s.others){
    h += '<div class="sorders"><span class="skey">Total orders</span><b>'+sgn(s.orders)+'</b>' +
      [['JPN', s.jpn], ['MACNN', s.macnn], ['Others', s.others]].map(function(x){
        return '<span class="dchip'+(x[1] ? '' : ' zero')+'">'+x[0]+'<b>'+sgn(x[1])+'</b></span>';
      }).join('') + '</div>';
  }

  if(e){
    h += tallyHTML(s, COLL_TAGS);
    h += '<div class="sformula"><b>'+sgn(s.onHand)+'</b> on hand − <b>'+s.collection+'</b> collected = <b>'+remTxt+'</b> '+invLabel.toLowerCase();
    h += '<span class="upline"><b>'+sgn(s.supply)+'</b> '+s.supplyFrom+' − <b>'+s.source+'</b> mine total = <b>'+
         balTxt+'</b> '+BAL_LABEL[s.bal].toLowerCase()+'</span>';
    h += '</div>';
    if(s.bal === 'shortstock'){
      h += '<div class="snote"><b>Short '+(-s.balance)+'.</b> '+plural(-s.balance, 'more unit is', 'more units are')+
           ' mined than '+s.supplyFrom+'. Order more or cancel miners.</div>';
    }
    if(over){
      h += '<div class="snote"><b>Check the sheet.</b> '+plural(-s.projected, 'more unit is', 'more units are')+
           ' collected than '+(s.upcoming ? 'on hand plus upcoming' : 'on hand')+'.</div>';
    } else if(short){
      h += '<div class="snote"><b>Covered by upcoming.</b> '+plural(-s.remaining, 'unit is', 'units are')+
           ' collected ahead of stock. The '+s.upcoming+' upcoming covers them'+
           (s.projected ? ', with '+s.projected+' left after.' : '.')+'</div>';
    }
    if(s.upRaw < 0){
      h += '<div class="snote"><b>Upcoming is '+sgn(s.upRaw)+' in the sheet.</b> Stock on hand is more than Total orders. ' +
           'JPN, MACNN or Others may be missing a number.</div>';
    }
  } else {
    h += '<div class="sformula">Stock On Hand and Total Orders are 0 in the sheet. Fill them in to see what is left.</div>';
  }

  /* collection: Paid / Collection, the sheet's Completion % */
  h += '<div class="scoll"><div class="suphead"><span class="skey">Collection completion</span>' +
       '<span class="supsub"><b>'+pct(s.completion)+'</b> paid · '+s.paid+' of '+s.collection+'</span></div>';
  if(s.collection){
    h += '<div class="supbar" role="img" aria-label="'+s.paid+' paid and '+s.invoiced+' invoiced of '+s.collection+' collected">' +
      (s.paid ? '<i style="flex:'+s.paid+';background:var(--c-paid)" title="Paid '+s.paid+'"></i>' : '') +
      (s.invoiced ? '<i style="flex:'+s.invoiced+';background:var(--c-inv)" title="Invoiced '+s.invoiced+'"></i>' : '') +
      '</div>';
  } else {
    h += '<div class="supbar"><i class="free" style="flex:1" title="Nothing collected yet"></i></div>';
  }
  h += '</div>';

  h += '<div class="stiles">';
  STOCK_TAGS.forEach(function(t){
    var v = s[t.k], inColl = t.k === 'invoiced' || t.k === 'paid';
    var note = inColl ? (s.collection ? Math.round(v / s.collection * 100) + '% of collection' : ' ') : 'not in collection';
    h += '<div class="stile'+(v ? '' : ' zero')+'">' +
           '<span class="skey" style="--sw:'+t.c+'"><i></i>'+t.label+'</span>' +
           '<b>'+v+'</b><small>'+note+'</small>' +
           (t.k === 'paid' ? '<small class="ssum">Paid+Hold+Semi <b>'+(s.paid + s.paidHold + s.semiPaid)+'</b></small>' : '') +
         '</div>';
  });
  h += '</div>';

  var onHold = s.paidHold + s.semiPaid;
  h += '<div class="stiles sminers">' +
    '<div class="stile'+(s.source ? '' : ' zero')+'"><span class="skey">Mine total</span><b>'+s.source+'</b><small>all miner rows</small></div>' +
    '<div class="stile'+(s.onHand ? '' : ' zero')+'"><span class="skey">Stock on hand</span><b>'+sgn(s.onHand)+'</b><small>arrived stock</small></div>' +
    '<div class="stile'+(s.collection ? '' : ' zero')+'"><span class="skey">Current invoice</span><b>'+s.collection+'</b><small>invoiced + paid</small></div>' +
    '<div class="stile'+(s.noAlloc ? '' : ' zero')+'"><span class="skey">No allocation yet</span><b>'+s.noAlloc+'</b><small>not invoiced or paid</small></div>' +
    '<div class="stile'+(onHold ? '' : ' zero')+'"><span class="skey">On-hold</span><b>'+onHold+'</b><small>paid-hold + semi-paid</small></div>' +
    '</div>';

  if(e && s.upcoming) h += upcomingHTML(s);

  return h + '</div>';
}

/* sheet mode: heading with the row number + Edit in Sheet, then a warning when the numbers are old */
function sheetStockHead(it){
  var h = '<div class="sect"><h3>Stock and miners <span class="shead-r">' +
    (it._sheetRow ? '<span class="ssrc">Sheet row ' + it._sheetRow + '</span>' : '') +

  if(SYNC.err){

         ' These numbers may be old.</div>';

/* a code that was in the sheet before and is gone now. The app never deletes it on its own. */
function removedCard(it){
  return '<div class="rmcard"><div class="rmtop"><span class="stag gone">Removed from sheet</span></div>' +
    '<p>This code was in the sheet before, but the row is gone now. The item stays in the app until you decide.</p>' +
    '<ol>' +
      '<li><b>Archive</b> (recommended). It stays searchable, marked Do not use.</li>' +
      '<li><b>Delete</b>. Removes it from the app. Export after.</li>' +
      '<li><b>Keep</b>. Ask for the row back in the sheet, with the same code.</li>' +
    '</ol>' +

      (it.archived ? '' : '<button class="pact go" data-archive="'+esc(it.code)+'">Archive</button>') +
      '<button class="pact" data-delitem="'+esc(it.code)+'">Delete</button>' +
      '<button class="pact" data-copy="'+esc(it.code)+'">Copy code</button>' +
    '</div></div>';
}

/* Upcoming stock, broken down:
   Tagged ahead = miners tagged past what arrived, waiting on the upcoming units (capped at upcoming)
   Open         = upcoming units nobody is tagged on yet
   Left after   = arrived + upcoming - tagged  (negative = over tagged) */
function upcomingHTML(s){
  var U = s.upcoming;
  if(!U){
    return '<div class="sup none"><span class="skey"><i class="dash"></i>Upcoming stock</span>' +
           '<span class="supsub">None ordered</span></div>';
  }
  var A = s.arrived || 0, T = s.tagged, total = A + U;
  var ahead = Math.max(0, Math.min(U, T - A));
  var open = U - ahead;
  var over = Math.max(0, T - total);
  var after = s.projected;

  var h = '<div class="sup">';
  h += '<div class="suphead"><span class="skey"><i class="dash"></i>Upcoming stock</span>' +
       '<span class="supsub">Ordered, not here yet</span></div>';

  h += '<div class="supbar" role="img" aria-label="'+ahead+' of '+U+' upcoming already tagged, '+open+' open'+
       (over ? ', '+over+' tagged with no stock' : '')+'">';
  if(ahead) h += '<i class="claimed" style="flex:'+ahead+'" title="'+ahead+' tagged ahead"></i>';
  if(open) h += '<i class="free" style="flex:'+open+'" title="'+open+' open"></i>';
  if(over) h += '<i class="nostock" style="flex:'+over+'" title="'+over+' tagged with no stock"></i>';
  h += '</div>';

  h += '<div class="stiles">' +
    '<div class="stile"><span class="skey">On the way</span><b class="up">+'+U+'</b><small>units ordered</small></div>' +
    '<div class="stile'+(ahead ? '' : ' zero')+'"><span class="skey">Tagged ahead</span><b>'+ahead+'</b>' +
      '<small>'+(ahead ? 'waiting for it' : 'nobody yet')+'</small></div>' +
    '<div class="stile'+(open ? '' : ' zero')+'"><span class="skey">Open</span><b>'+open+'</b>' +
      '<small>'+(open ? (s.waiting ? 'offer to waiting' : 'free to tag') : 'all spoken for')+'</small></div>' +
    '<div class="stile'+(after < 0 ? ' warn' : after ? '' : ' zero')+'"><span class="skey">Left after</span>' +
      '<b>'+(after < 0 ? '−' + (-after) : after)+'</b>' +
      '<small>'+(after < 0 ? 'over tagged' : 'of ' + total + ' total')+'</small></div>' +
    '</div>';

  return h + '</div>';
}

function suggestFile(it){ return it.code.toLowerCase() + '.jpg'; }
function photoFile(it){ return it.image || suggestFile(it); }

/* A photo dropped into the editor shows right away, from memory, until the
   downloaded file is moved into /images. Keyed by filename, lost on reload. */
var sessionPhotos = {};
function photoSrc(file){ return sessionPhotos[file] || ('images/' + file); }

/* Which items really have a photo. Most items leave the image field blank and
   load code.jpg instead, so the field alone is wrong. The only true answer is
   whether the file loads. Each file is checked once, a few at a time.
   photoSeen[file]: true = loads, false = missing, undefined = still checking. */
var photoSeen = {}, photoWait = [], photoBusy = 0;
function hasPhoto(it){
  var f = photoFile(it);
  return sessionPhotos[f] ? true : photoSeen[f];
}
function photosChecking(){ return photoBusy > 0 || photoWait.length > 0; }
function checkPhotos(){
  ITEMS.forEach(function(it){
    var f = photoFile(it);
    if(f in photoSeen || photoWait.indexOf(f) > -1) return;
    photoSeen[f] = undefined;
    photoWait.push(f);
  });
  pumpPhotos();
}
function pumpPhotos(){
  while(photoBusy < 8 && photoWait.length){
    (function(f){
      var src = photoSrc(f);
      photoBusy++;
      /* Over http (Netlify, local server) ask for the headers only, so a check
         does not download the whole photo. file:// can't fetch, so load it. */
      if(/^https?:/.test(location.protocol) && src.indexOf('images/') === 0){
        fetch(src, {method:'HEAD'}).then(function(r){ done(r.ok); }, function(){ done(false); });
      } else {
        var img = new Image();
        img.onload = function(){ done(true); };
        img.onerror = function(){ done(false); };
        img.src = src;
      }
      function done(ok){
        photoSeen[f] = ok; photoBusy--;
        pumpPhotos();
        if(!photosChecking()) photosChecked();
      }
    })(photoWait.shift());
  }
}
/* all checked: refresh the chip count, and the list if it is filtered by photo */
function photosChecked(){
  if(state.flag !== 'nophoto'){ renderFilters(); return; }
  var lp = $('#listpane'), ls = lp.scrollTop;
  quiet = true; render(); quiet = false;
  lp.scrollTop = ls;
}

function openLightbox(){
  var img = document.querySelector('.dphoto img');
  if(!img) return;
  var s = mount('<img src="'+esc(img.getAttribute('src'))+'" alt="'+esc(img.alt)+'">');
  s.classList.add('lightbox');
  s.addEventListener('click', function(){ s.remove(); });
}

document.addEventListener('click', function(e){
  var c = e.target.closest('[data-copy]');
  if(c){ copy(c.dataset.copy); return; }
  var r = e.target.closest('[data-reply]');
  if(r){
    var parts = r.dataset.reply.split('|'), rit = itemByCode(parts[0]);
    if(!rit) return;
    var rposts = rit.posts || [], ri = +parts[1], one = rposts[ri];
    var entry = one ? [{l:one, i:ri, many: rposts.length > 1}] : [];
    copy(replyText(rit, entry), 'Reply copied');
    return;
  }
  var ra = e.target.closest('[data-replyall]');
  if(ra){
    var ait = itemByCode(ra.dataset.replyall);
    if(ait){
      var aposts = ait.posts || [];
      var entries = aposts.map(function(l, i){ return {l:l, i:i, many: aposts.length > 1}; });
      copy(replyText(ait, entries), 'Reply copied');
    }
    return;
  }
  var ca = e.target.closest('[data-copyall]');
  if(ca){
    var cit = itemByCode(ca.dataset.copyall);
    if(cit) copy((cit.posts||[]).map(function(l){ return l.url; }).join('\n'), 'All links copied');
    return;
  }
  if(e.target.closest('[data-zoom]')){ openLightbox(); return; }
  var di = e.target.closest('[data-dlimg]');
  if(di){ downloadPhoto(di.dataset.dlimg); return; }
  var es = e.target.closest('[data-editstock]');
  if(es){ openEditor(itemByCode(es.dataset.editstock), false, true); return; }
  var se = e.target.closest('[data-sheetedit]');
  if(se){ openInSheet(se.dataset.sheetedit); return; }
  var ar = e.target.closest('[data-archive]');
  if(ar){
    var arit = itemByCode(ar.dataset.archive);
    if(!arit) return;
    var rec = recOf(arit); rec.archived = !arit.archived;
    overlay.items[rec.code] = rec;
    persist(); rebuild(); render();
    toast(rec.archived ? 'Archived. Export to keep it' : 'Unarchived');
    return;
  }
  var dl = e.target.closest('[data-delitem]');
  if(dl){ deleteItem(dl.dataset.delitem); return; }
  var ed = e.target.closest('[data-edit]');
  if(ed){ openEditor(itemByCode(ed.dataset.edit)); return; }
  var dp = e.target.closest('[data-dup]');
  if(dp){
    var src = itemByCode(dp.dataset.dup);
    var cp = JSON.parse(JSON.stringify(src));
    cp.code = uniqueCode(src.code + '-COPY'); cp._seq = 9999; delete cp._hay;
    cp.stock = null; cp._appStock = null;   /* a copy is a new item, its stock starts empty */
    openEditor(cp, true);
    return;
  }
});

/* the saved shape of an item: what goes in the overlay and in items.js.
   Stock is the app's own copy, never the numbers read from the sheet. */
function recOf(it){
  return {code:it.code, name:it.name, series:it.series, sub:it.sub||null, promo:!!it.promo,
          pack:it.pack, marques:it.marques||[], blvd:it.blvd||null, image:it.image||'',
          posts:normLinks(it.posts), notes:it.notes||'', archived:!!it.archived,
          stock:it._appStock || null, _seq:it._seq};
}
function deleteItem(code){
  var it = itemByCode(code);
  if(!it) return false;
  if(!confirm('Delete "' + it.name + '" from the index?\n\nIt comes back if you re-import the seed file. Export after to make it stick.')) return false;
  overlay.removed = (overlay.removed||[]).concat([code]);
  delete overlay.items[code];
  persist(); rebuild();
  if(state.selected === code) state.selected = null;
  render(); toast('Deleted');
  return true;
}
/* Edit in Sheet: open the sheet on the item's row. Not in the sheet yet: copy the code to paste in a new row. */
function openInSheet(code){
  var it = itemByCode(code);
  if(!sheetCfg.edit){
    toast('Add the sheet link first');
    openSheetModal('edit');
    return;
  }
  window.open(sheetEditUrl(it && it._sheetRow), '_blank', 'noopener');
  if(it && !it._sheetRow) copy(it.code, 'Code copied. Add a row and paste it');
}

/* Save the item photo out of /images as a real file download.
   Three routes, tried in order, because a page opened straight off the disk
   (file://) is not allowed to read its own image bytes in most browsers:
     1. fetch the file and hand the browser a blob  (works over http)
     2. draw the already loaded <img> into a canvas and pull the bytes out
     3. plain download link, which some browsers turn into a new tab
   Route 3 is the only one that can open a tab, and it says so.
   Phones go through the share sheet first (see shareRoute). */
function downloadPhoto(file, noShare){
  if(!file) return;
  if(!noShare && canShareFiles() && shareRoute(file)) return;
  var src = photoSrc(file);

  function grab(href, revoke){
    var a = document.createElement('a');
    a.href = href; a.download = file; a.rel = 'noopener';
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    if(revoke) setTimeout(function(){ URL.revokeObjectURL(href); }, 4000);
  }

  /* 2 - canvas readback off the photo already on screen */
  function fromCanvas(){
    var img = document.querySelector('.dphoto img');
    if(!img || !img.naturalWidth) return false;
    try{
      var cv = document.createElement('canvas');
      cv.width = img.naturalWidth; cv.height = img.naturalHeight;
      cv.getContext('2d').drawImage(img, 0, 0);
      var type = /\.png$/i.test(file) ? 'image/png'
               : /\.webp$/i.test(file) ? 'image/webp' : 'image/jpeg';
      if(cv.toBlob){
        cv.toBlob(function(b){
          if(b){ grab(URL.createObjectURL(b), true); toast('Saved ' + file); }
          else { grab(src); toast('Saving ' + file); }
        }, type, 0.95);
      } else {
        grab(cv.toDataURL(type, 0.95));
        toast('Saved ' + file);
      }
      return true;
    }catch(err){ return false; }   /* tainted canvas on file:// */
  }

  /* 3 - last resort */
  function plainLink(){
    grab(src);
    toast(location.protocol === 'file:'
      ? 'Opened ' + file + ' \u2014 run the local server to save it as a file'
      : 'Saving ' + file);
  }

  /* 1 - fetch to blob, the only route that always keeps the filename */
  if(typeof fetch === 'function'){
    fetch(src).then(function(r){
      if(!r.ok) throw 0;
      return r.blob();
    }).then(function(b){
      grab(URL.createObjectURL(b), true);
      toast('Saved ' + file);
    }).catch(function(){
      if(!fromCanvas()) plainLink();
    });
    return;
  }
  if(!fromCanvas()) plainLink();
}

/* Phone: a download link on iPhone only reaches Files. The share sheet has
   "Save Image", which puts the photo in Photos. The sheet has to open straight
   from the tap, so the photo bytes are fetched when the item opens, not on tap. */
var touchMQ = window.matchMedia ? matchMedia('(pointer: coarse)') : null;
function canShareFiles(){
  if(!touchMQ || !touchMQ.matches || !navigator.share || !navigator.canShare || typeof File !== 'function') return false;
  try{ return navigator.canShare({files:[new File([''], 'x.jpg', {type:'image/jpeg'})]}); }catch(e){ return false; }
}
var sharePhoto = {src:null, file:null, blob:null, wait:null};
function prepSharePhoto(file){
  var src = photoSrc(file);
  if(sharePhoto.src === src) return sharePhoto.wait;
  var mine = sharePhoto = {src:src, file:file, blob:null, wait:null};
  mine.wait = fetch(src).then(function(r){ if(!r.ok) throw 0; return r.blob(); })
    .then(function(b){ mine.blob = b; return b; }, function(){ return null; });
  return mine.wait;
}
function shareBlob(file, blob){
  var f = new File([blob], file, {type: blob.type || 'image/jpeg'});
  if(!navigator.canShare({files:[f]})) return false;
  navigator.share({files:[f]}).catch(function(err){
    /* AbortError = the sheet was closed, nothing to say */
    if(err && err.name === 'NotAllowedError') toast('Photo ready. Tap Save photo again');
  });
  return true;
}
/* true = handled here (shared, or waiting on the bytes). The download routes take over if sharing can't. */
function shareRoute(file){
  var src = photoSrc(file);
  if(sharePhoto.src === src && sharePhoto.blob) return shareBlob(file, sharePhoto.blob);
  prepSharePhoto(file).then(function(b){
    if(!b || !shareBlob(file, b)) downloadPhoto(file, true);
  });
  return true;
}

function copy(t, msg){
  if(!t) return;
  navigator.clipboard.writeText(t).then(function(){ toast(msg || 'Copied'); },
    function(){
      var ta = document.createElement('textarea'); ta.value = t; document.body.appendChild(ta);
      ta.select(); try{ document.execCommand('copy'); toast(msg||'Copied'); }catch(e){}
      document.body.removeChild(ta);
    });
}
var toastT;
function toast(m){
  var old = document.querySelector('.toast'); if(old) old.remove();
  var el = document.createElement('div'); el.className = 'toast'; el.textContent = m;
  document.body.appendChild(el);
  clearTimeout(toastT); toastT = setTimeout(function(){ el.remove(); }, 1900);
}

  'Boulevard':'BLVD','Fast & Furious':'FNF','Car Culture':'CC','Pop Culture':'POP',
  'Team Transport':'TT','Modern Classics':'MC','Japan Historics':'JPNHIST','Terra Trek':'TERRA',
  'Slide Street':'SLIDE','Circuit Legends':'CIRCUIT','Eurospeed':'EURO','Timeless Icons':'TIMELESS',
  'Vintage Racing':'VINTAGE','Thrill Climbers':'THRILL','Ronin Run':'RONIN','Mountain Drifters':'MTNDRIFT',
  'Power Trip':'POWER','Aerostyle':'AERO','Fast Wagons':'WAGONS','Deutscheland Design':'DEUTSCH',
  'Road Trip':'ROADTRIP','Silhouette':'SILHOUETTE','Hammer Drop':'HAMMER','Off Road':'OFFROAD',
  'Race Day':'RACEDAY','Speedgraphics':'SPEEDGFX','Garage':'GARAGE','Acceleracers':'ACCEL',
  'Exotic Envy':'EXOTIC','Kool Kombi':'KOMBI','Barbie':'BARBIE','Formula 1':'F1','Gran Turismo':'GT',
  'Replay the Classics':'REPLAY','Entertainment':'ENTER','Pantone':'PANTONE','Compact Kings':'COMPACT',
  'Rally Racers':'RALLY','Mustang Cars':'MUSTANGSET','Surf Up':'SURF','Gulf':'GULF','Graphic Remix':'REMIX',
  'Performance Trucks':'TRUCKS','Racing Culture':'RACING','Zamac':'ZAMAC','2-Pack':'2PK','5-Pack':'5PK',
  'Mainline / Basic':'BASIC','Premium':'PREMIUM','Silver':'SILVER','Gold':'GOLD','Canyon Warriors':'CANYON','Sale Post':'SALE','Other':'MISC'
};
var PACK_TOK = {'Box':'BOX','Case':'CASE','Set':'SET','5-Pack':'5PK','2-Pack':'','Single':''};
var STOP = {'hw':1,'the':1,'and':1,'a':1,'of':1,'w':1,'set':1,'box':1,'case':1,'pcs':1,'pc':1,
            'piece':1,'pieces':1,'only':1,'new':1,'for':1,'with':1};

function genCode(name, series, pack, promo){
  var s = String(name||'');
  var blvd = null, m = s.match(/BLVD\s*#?\s*(\d{1,3})/i);
  if(m) blvd = m[1];
  var clean = s.replace(/\[[^\]]*\]|DO NOT USE|PLACEHOLDER ONLY/ig,' ')
               .replace(/[()]/g,' ')
               .replace(/\bHW\b|\bPROMO\b|\bBLVD\b|\bBoulevard\b/ig,' ')
               .replace(new RegExp('\\b'+(series||'').replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+'\\b','ig'),' ')
               .replace(/\bset of \d+\b|\bbox of \d+\b|\bsealed box\b|\bsealed case\b|\bbox\b|\bcase\b|\bset\b|\bsingles?\b|\bpiece\b/ig,' ')
               .replace(/[^A-Za-z0-9#'\- ]/g,' ')
               .replace(/\s+/g,' ').trim();
  var toks = clean.split(' ').filter(function(t){ return t && !STOP[t.toLowerCase()]; });
  var key = [];
  for(var i=0;i<toks.length && key.length<3;i++){
    var t = toks[i].replace(/[^A-Za-z0-9]/g,'').toUpperCase();
    if(!t || t === blvd || key.indexOf(t) > -1) continue;
    key.push(t.slice(0,10));
  }
  var parts = ['HW'];
  if(promo) parts.push('PROMO');
  parts.push(SERIES_TOK[series] || 'MISC');
  if(blvd) parts.push(blvd);
  parts = parts.concat(key);
  var pt = PACK_TOK[pack] || '';
  if(pt && parts.indexOf(pt) === -1) parts.push(pt);
  return parts.filter(Boolean).join('-').replace(/-+/g,'-').replace(/^-|-$/g,'').slice(0,48);
}
function uniqueCode(base, ignore){
  var c = base, n = 1;
  while(ITEMS.some(function(i){ return i.code === c && i.code !== ignore; })){ n++; c = base + '-' + n; }
  return c;
}

      uniqueCode(genCode(name, scrim.querySelector('#e_series').value, scrim.querySelector('#e_pack').value, false), original);

    var rec = {

    };
    if(original && original !== code){ overlay.removed = (overlay.removed||[]).concat([original]); delete overlay.items[original]; }
    /* a code deleted earlier and now reused (same name, or renamed back) must show again */
    overlay.removed = (overlay.removed||[]).filter(function(c){ return c !== code; });
    overlay.items[code] = rec;
    persist(); rebuild();

    scrim.remove(); render();
    /* new pre-order flow: the code goes into a new row in the sheet */
    if(sheetMode && (isNew || !original) && !itemByCode(code)._inSheet) copy(code, 'Saved. Code copied for the sheet');

function mount(html){
  var s = document.createElement('div');
  s.className = 'scrim';
  s.innerHTML = html;
  document.body.appendChild(s);
  s.addEventListener('click', function(e){
    if(e.target === s || e.target.closest('[data-close]')) s.remove();
  });
  var first = s.querySelector('input,select,textarea');
  if(first) setTimeout(function(){ first.focus(); }, 40);
  return s;
}

function exportFile(){
  var out = ITEMS.map(function(it){
    var o = {code:it.code, name:it.name, series:it.series, sub:it.sub||null, promo:!!it.promo,
            pack:it.pack, marques:it.marques||[], blvd:it.blvd||null, image:it.image||'',
            posts:normLinks(it.posts), notes:it.notes||'', archived:!!it.archived};
    /* only items with numbers carry a stock block. Once the sheet is connected it owns them, so none go out. */
    var st = sheetOn() ? null : cleanStock(it._appStock);
    if(st) o.stock = st;
    return o;
  });
  var seq = {};
  ITEMS.forEach(function(x){ seq[x.code] = x._seq; });
  out.sort(function(a,b){ return (seq[a.code]||0) - (seq[b.code]||0); });
  var txt = '/* HW ITEM INVENTORY - data file\n' +
    '   Exported ' + new Date().toISOString().slice(0,16).replace('T',' ') + '\n' +
    '   Replace data/items.js with this file to make the changes permanent. */\n\n' +
    'window.HW_ITEMS = ' + JSON.stringify(out, null, 1) + ';\n';
  var blob = new Blob([txt], {type:'application/javascript'});
  var a = document.createElement('a');
  a.href = URL.createObjectURL(blob); a.download = 'items.js'; a.click();
  toast('Replace data/items.js with it');
}
function importFile(){
  var fi = document.createElement('input'); fi.type = 'file'; fi.accept = '.js,.json,application/json,text/javascript';
  fi.onchange = function(){
    var f = fi.files[0]; if(!f) return;
    var rd = new FileReader();
    rd.onload = function(){
      try{
        var t = String(rd.result);
        var mi = t.match(/window\.HW_ITEMS\s*=\s*([\s\S]*?);\s*$/);
        var mp = t.match(/window\.HW_POSTS\s*=\s*([\s\S]*?);\s*\n/);
        var items = mi ? JSON.parse(mi[1]) : JSON.parse(t);
        if(mp){ /* old file shape - keep its urls so {postId} links survive */
          JSON.parse(mp[1]).forEach(function(q){ if(q && q.id && q.url) LEGACY_URL[q.id] = q.url; });
        }
        if(!Array.isArray(items)) throw new Error('bad');
        if(!confirm('Import ' + items.length + ' items?\n\nThis replaces what is on screen now.')) return;
        overlay = {items:{}, removed:[]};
        items.forEach(function(it, i){ it._seq = i+1; it.posts = normLinks(it.posts); overlay.items[it.code] = it; });
        persist(); rebuild(); render();
        toast('Imported ' + items.length + ' items');
      }catch(e){ toast('Could not read that file'); }
    };
    rd.readAsText(f);
  };
  fi.click();
}

function renderDirty(){
  var b = $('#dirtybar');
  if(!state.dirty){ b.innerHTML = ''; return; }
  b.innerHTML = '<div class="dirtybar"><span><b>Unsaved to file</b> &nbsp;Your edits live in this browser only. ' +
    'Export and replace data/items.js to keep them for good.</span>' +
    '<span style="display:flex;gap:7px"><button class="tbtn" id="d_reset">Discard</button>' +
    '<button class="tbtn primary" id="d_exp">Export now</button></span></div>';
  $('#d_exp').onclick = exportFile;
  $('#d_reset').onclick = function(){
    if(!confirm('Discard every edit made in this browser since the last export?')) return;
    overlay = {items:{}, removed:[]};
    localStorage.removeItem(LS_KEY);
    state.dirty = false; state.selected = null;
    rebuild(); render();
  };
}

/* ============================================================
   GOOGLE SHEET - header pill + connect box (v4)
   ============================================================ */
function syncLook(){
  if(!sheetCfg.csv) return {cls:'sync-off', text:'Connect sheet', sub:'Not connected. Stock numbers come from the app.'};
  var at = sheetCache ? sheetTime(sheetCache.at) : '';
  if(SYNC.err) return {cls:'sync-err', text: sheetCache ? (navigator.onLine === false ? 'Offline · ' : 'Sync failed · ') + at : 'Sheet not loaded',
                       sub: SYNC.err + (sheetCache ? ' Showing the last good copy from ' + at + '.' : '')};
  if(!sheetCache) return {cls:'sync-busy', text:'Syncing…', sub:'Loading the sheet for the first time.'};
  return {cls: SYNC.busy ? 'sync-busy' : 'sync-ok', text:'Synced ' + at,
          sub:'Checks the sheet every 60 seconds, and when you come back to this tab.'};
}
function renderSync(){
  var box = $('#syncbox'), look = syncLook(), iss = sheetIssues();
  box.className = 'syncbox ' + look.cls + (SYNC.busy && look.cls !== 'sync-busy' ? ' sync-busy' : '');
  $('#synctext').innerHTML = esc(look.text) +
    (iss.total ? ' <span class="syncissue" title="'+iss.total+' to check in the sheet">'+iss.total+'</span>' : '');
  $('#syncpill').title = look.sub + (iss.total ? ' ' + iss.total + ' thing(s) to check in the sheet.' : '');
}

function openSheetModal(focus){
  var had = sheetCfg.csv;
  var h = '<div class="modal" role="dialog" aria-modal="true" data-sheetmodal>' +
    '<div class="mhead"><h2>Google <em>Sheet</em></h2><button class="tbtn" data-close>Close</button></div>' +
    '<div class="mbody">' +
      '<div id="sh_state"></div>' +
      (location.protocol === 'file:'
        ? '<p class="shwarn" style="margin-top:12px">This page was opened by double-click. Google does not let the sheet load this way. ' +
          'Open it through the local server (http://localhost:8777) or the Netlify link.</p>'
        : '') +
      '<div id="sh_issues"></div>' +
      '<div class="sect"><h3>Links</h3>' +
        '<div class="fgrid" style="margin-top:14px">' +
          '<div class="f full"><label>CSV link (Publish to web)</label>' +
            '<input id="sh_csv" class="mono" spellcheck="false" value="'+esc(sheetCfg.csv)+'" placeholder="https://docs.google.com/spreadsheets/d/e/…/pub?gid=…&amp;single=true&amp;output=csv">' +
            '<div class="shwarn" id="sh_csvwarn"></div>' +
            '<ol class="shsteps">' +
              '<li>In the sheet: <b>File &gt; Share &gt; Publish to web</b>.</li>' +
              '<li>Pick the <b>Dashboard</b> tab, not Entire document (the miner names stay private).</li>' +
              '<li>Pick <b>Comma-separated values (.csv)</b>, then Publish. Copy the link and paste it here.</li>' +
            '</ol></div>' +
          '<div class="f full"><label>Sheet link (the one you edit in)</label>' +
            '<input id="sh_edit" class="mono" spellcheck="false" value="'+esc(sheetCfg.edit)+'" placeholder="https://docs.google.com/spreadsheets/d/…/edit">' +
            '<span class="hint">Used by Edit in Sheet. It opens the sheet on the item\'s row. Copy it from the address bar while the Dashboard tab is open.</span></div>' +
        '</div>' +
        '<p class="hint" style="font-size:13px;color:var(--ink-3);line-height:1.6;margin-top:16px">' +
          'Google can take up to 5 minutes to update a published CSV after a change. The links are saved in this browser only.</p>' +
      '</div>' +
    '</div><div class="mfoot">' +
      (had ? '<button class="tbtn warn" id="sh_off">Disconnect</button>' : '<span></span>') +
      '<span style="display:flex;gap:7px">' +
        (had ? '<button class="tbtn" id="sh_sync">Refresh now</button>' : '<button class="tbtn" data-close>Cancel</button>') +
        '<button class="tbtn primary" id="sh_save">'+(had ? 'Save and sync' : 'Connect')+'</button></span>' +
    '</div></div>';
  var scrim = mount(h);
  drawSheetState(scrim);
  if(focus === 'edit') setTimeout(function(){ scrim.querySelector('#sh_edit').focus(); }, 60);

  var csvIn = scrim.querySelector('#sh_csv');
  function checkCsv(){
    var v = csvIn.value.trim(), w = '';
    if(v && !/^https?:\/\//i.test(v)) w = 'This does not look like a link.';
    else if(/docs\.google\.com/i.test(v) && /\/edit/i.test(v)) w = 'This is the edit link. Paste it in the second box. The CSV link comes from Publish to web.';
    else if(/docs\.google\.com/i.test(v) && !/output=csv/i.test(v)) w = 'The link should end with output=csv. Pick Comma-separated values when you publish.';
    else if(/docs\.google\.com/i.test(v) && !/single=true/i.test(v)) w = 'This looks like the whole file is published. Publish the Dashboard tab only, so the miner names stay private.';
    scrim.querySelector('#sh_csvwarn').textContent = w;
  }
  csvIn.addEventListener('input', checkCsv); checkCsv();

  scrim.querySelector('#sh_save').onclick = function(){
    var csv = csvIn.value.trim(), edit = scrim.querySelector('#sh_edit').value.trim();
    if(!/^https?:\/\//i.test(csv)){ toast('Paste the CSV link first'); csvIn.focus(); return; }
    var urlChanged = csv !== sheetCfg.csv;
    sheetCfg = {csv:csv, edit:edit}; saveSheetCfg();
    if(urlChanged){ sheetCache = null; saveSheetCache(); SYNC.err = ''; rebuild(); render(); }
    scrim.remove();
    renderSync(); renderDetail();
    syncSheet(true);
  };
  var sy = scrim.querySelector('#sh_sync');
  if(sy) sy.onclick = function(){ syncSheet(true); };
  var off = scrim.querySelector('#sh_off');
  if(off) off.onclick = function(){
    if(!confirm('Disconnect the Google Sheet?\n\nStock numbers go back to what is saved in the app.')) return;
    sheetCfg = {csv:'', edit:''}; sheetCache = null; SYNC.err = '';
    try{ localStorage.setItem(SHEET_CFG_KEY, JSON.stringify({csv:'', edit:'', off:true})); }catch(e){}
    saveSheetCache();
    scrim.remove(); rebuild(); render(); renderSync();
    toast('Sheet disconnected');
  };
}
/* status + things to check, redrawn after each sync while the box is open */
function drawSheetState(scope){
  var look = syncLook(), st = scope.querySelector('#sh_state'), is = scope.querySelector('#sh_issues');
  if(!st) return;
  var sub = look.sub;
  if(sheetCache){
    var matched = 0, withNums = 0;
    ITEMS.forEach(function(it){ if(it._inSheet){ matched++; if(it.stock) withNums++; } });
    sub = sheetCache.count + ' rows in the sheet · ' + matched + ' match an item · ' + withNums + ' with numbers. ' + sub;
  }
  st.innerHTML = '<div class="shstate ' + look.cls + '"><i class="syncdot"></i><div><b>' + esc(look.text) + '</b><span>' + esc(sub) + '</span></div></div>';

  var iss = sheetIssues(), h = '';
  if(iss.total){
    h += '<div class="sect"><h3>Check the sheet <span>' + iss.total + '</span></h3>';
    if(iss.missing.length){
      h += '<div class="shissue"><p><b>Column not found.</b> Counted as blank. Check the header text in row 1.</p>' +
           '<ul class="shlist">' + iss.missing.map(function(m){ return '<li><code>' + esc(m) + '</code></li>'; }).join('') + '</ul></div>';
    }
    if(iss.unknown.length){
      h += '<div class="shissue"><p><b>Code not in the app.</b> Maybe a typo. Fix it in the sheet, or add the item in the app. ' +
           '<button class="slink" data-copy="' + esc(iss.unknown.map(function(u){ return u.code; }).join('\n')) + '">Copy list</button></p>' +
           '<ul class="shlist">' + iss.unknown.map(function(u){ return '<li><code>' + esc(u.code) + '</code><span>Row ' + u.row + '</span></li>'; }).join('') + '</ul></div>';
    }
    if(iss.dups.length){
      h += '<div class="shissue"><p><b>Same code on more than one row.</b> The app uses the first row only.</p>' +
           '<ul class="shlist">' + iss.dups.map(function(d){ return '<li><code>' + esc(d.code) + '</code><span>Row ' + d.row + ' (first on row ' + d.first + ')</span></li>'; }).join('') + '</ul></div>';
    }
    if(iss.bad.length){
      h += '<div class="shissue"><p><b>Not a number.</b> Counted as blank.</p>' +
           '<ul class="shlist">' + iss.bad.map(function(b){ return '<li><code>' + esc(b.col) + ': ' + esc(b.val) + '</code><span>Row ' + b.row + '</span></li>'; }).join('') + '</ul></div>';
    }
    h += '</div>';
  }
  is.innerHTML = h;
}

$('#syncpill').onclick = function(){ openSheetModal(); };
$('#syncref').onclick = function(){ syncSheet(true); };
setInterval(function(){ if(!document.hidden) syncSheet(false); }, SHEET_EVERY);
document.addEventListener('visibilitychange', function(){
  if(!document.hidden && Date.now() - SYNC.lastTry > 15000) syncSheet(false);
});
window.addEventListener('focus', function(){ if(Date.now() - SYNC.lastTry > 15000) syncSheet(false); });
window.addEventListener('online', function(){ syncSheet(false); });
window.addEventListener('offline', function(){ renderSync(); });

/* ============================================================
   WIRING
   ============================================================ */
/* search waits for a short pause in typing, then redraws once, without the entrance animation */
var qTimer = 0;
function runSearch(){
  clearTimeout(qTimer); qTimer = 0;
  var v = $('#q').value;
  if(v === state.q) return;
  state.q = v;
  var dp = $('#detail'), ds = dp.scrollTop;
  $('#listpane').scrollTop = 0;
  quiet = true; render(); quiet = false;
  dp.scrollTop = ds;
}
$('#q').addEventListener('input', function(){ clearTimeout(qTimer); qTimer = setTimeout(runSearch, 120); });
$('#clearq').onclick = function(){ $('#q').value = ''; runSearch(); $('#q').focus(); };
$('#btnNew').onclick = function(){ openEditor(null, true); };
$('#btnExport').onclick = exportFile;
$('#btnImport').onclick = importFile;
$('#btnTheme').onclick = function(){
  var cur = document.documentElement.getAttribute('data-theme') ||
    (window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
  var next = cur === 'dark' ? 'light' : 'dark';
  document.documentElement.setAttribute('data-theme', next);
  try{ localStorage.setItem('hw_idx_theme', next); }catch(e){}
};
try{
  var th = localStorage.getItem('hw_idx_theme');
  if(th) document.documentElement.setAttribute('data-theme', th);
}catch(e){}

document.addEventListener('keydown', function(e){
  if(document.querySelector('.scrim')){
    if(e.key === 'Escape') document.querySelector('.scrim').remove();
    return;
  }
  var typing = /^(INPUT|TEXTAREA|SELECT)$/.test(document.activeElement.tagName);
  if(!typing && (e.key === '/' || ((e.metaKey||e.ctrlKey) && e.key === 'k'))){
    e.preventDefault(); $('#q').focus(); $('#q').select(); return;
  }
  if(e.key === 'Escape' && typing){ document.activeElement.blur(); return; }
  var grid = state.view === 'grid';
  if(e.key === 'Escape' && drawerMode() && state.selected){ closeDrawer(); return; }
  if(!typing && !e.metaKey && !e.ctrlKey && !e.altKey && (e.key === 'v' || e.key === 'V')){
    setView(grid ? 'list' : 'grid'); return;
  }
  /* grid: left/right = next card, up/down = one row of cards (one item while the drawer is open) */
  if(grid && !typing && (e.key === 'ArrowLeft' || e.key === 'ArrowRight')){
    e.preventDefault(); stepItem(e.key === 'ArrowRight' ? 1 : -1); return;
  }
  if(e.key === 'ArrowDown' || e.key === 'ArrowUp'){
    e.preventDefault();
    var n = grid && !state.selected ? gridCols() : 1;
    stepItem(e.key === 'ArrowDown' ? n : -n);
  }
  if(e.key === 'Enter' && typing && document.activeElement.id === 'q'){
    runSearch();   /* typed fast and hit Enter: use the full query, not the last redraw */
    var first = document.querySelector('#list .item');
    if(first){ select(first.dataset.code); document.activeElement.blur(); }
  }
});

render();
renderDirty();
renderSync();
syncSheet(false);
setTimeout(function(){ $('#q').focus(); }, 120);

})();
